<!doctype html><html><head></head><body data-uat="RUNNING">
<div id="soundEditor"></div><button id="addSoundButton"></button><button id="resetSoundboard"></button><button id="saveSoundDraft"></button>
<input id="pubTitle"><input id="homeTeam"><input id="awayTeam"><input id="venue"><input id="presetName" value="Game Day"><input id="slug">
<div id="updateTarget"></div><button id="updateGame" disabled>Update Current Version</button><button id="publishGame">Publish New Version</button><div id="publishResult"></div><div id="gamesList"></div><pre id="out"></pre>
<script>
window.__errors=[];addEventListener('error',e=>__errors.push(String(e.message||e.error)));
const $=id=>document.getElementById(id);const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const palette={orange:{},blue:{},green:{},red:{},purple:{},yellow:{},slate:{}};const effectIcons=[['','No icon'],['📣','Megaphone']];
const defaultSoundboard=[{id:'first-down',label:'First Down',eyebrow:'DOWN',group:'Downs',kind:'announcement',icon:'',color:'green',speechText:'First down',assetId:''}];
let soundboardDraft=structuredClone(defaultSoundboard);let selectedMusicIds=[];let renderedAssets=0;const messages=[];const rpcCalls=[];
function normalizeSoundItem(item){return {...item,kind:item.kind==='effect'?'effect':'announcement',icon:item.kind==='effect'?(item.icon||'📣'):''}}
function soundAssets(){return []}function renderAdminAssets(){renderedAssets++}function msg(t){messages.push(String(t))}function setTab(){}
const currentGame={id:'game-1',slug:'alpha-game',title:'Alpha Game',home_team:'Alpha',away_team:'Beta',venue:'Field 1',kickoff_at:null,current_version_id:'version-7'};
const currentVersion={id:'version-7',version:7,preset_name:'Friday Night',sound_assignments:{'first-down':'sound-1'},soundboard_config:[{id:'first-down',label:'First Down',eyebrow:'DOWN',group:'Downs',kind:'announcement',icon:'',color:'green',speechText:'First down'}],music_asset_ids:['music-1','music-2']};
function chainFor(table){if(table==='published_games')return{select(){return{eq(){return{single:async()=>({data:currentGame,error:null})}},order:async()=>({data:[currentGame],error:null})}}};if(table==='game_versions')return{select(){return{eq(){return{single:async()=>({data:currentVersion,error:null})}}}}};if(table==='admin_preferences')return{upsert:async()=>({error:null})};return{}}
const supabase={auth:{getUser:async()=>({data:{user:{id:'owner-1'}}})},from:chainFor,rpc:async(name,args)=>{rpcCalls.push({name,args});if(name==='update_current_game_version_v1')return{data:[{game_id:'game-1',version_id:'version-7',version:7,slug:'alpha-game'}],error:null};if(name==='publish_game_version_v3')return{data:[{game_id:'game-1',version_id:'version-8',version:8,slug:'alpha-game'}],error:null};return{data:null,error:{message:'unexpected rpc'}}}};
</script>
<script src="../app-part4.js"></script>
<script>
const results=[];const ok=(name,cond,detail='')=>results.push({name,pass:!!cond,detail});const wait=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{await window.__gamedayCurrentVersionAdminV1.loadGameForUpdate('alpha-game');
ok('Edit Current loads published game metadata',$('slug').value==='alpha-game'&&$('pubTitle').value==='Alpha Game',$('slug').value+' / '+$('pubTitle').value);
ok('Edit Current loads current version number',window.__gamedayCurrentVersionAdminV1.state().version===7,JSON.stringify(window.__gamedayCurrentVersionAdminV1.state()));
ok('Edit Current loads sound assignments into editor',soundboardDraft[0]?.assetId==='sound-1',soundboardDraft[0]?.assetId||'');
ok('Edit Current loads uploaded music selection',selectedMusicIds.join('|')==='music-1|music-2',selectedMusicIds.join('|'));
ok('Update Current Version becomes available',$('updateGame').disabled===false,String($('updateGame').disabled));
document.querySelector('[data-f="label"]').value='Updated First Down';$('updateGame').click();await wait(120);
const update=rpcCalls.find(x=>x.name==='update_current_game_version_v1');
ok('Update Current Version calls overwrite RPC',!!update,JSON.stringify(rpcCalls.map(x=>x.name)));
ok('Update sends edited current Soundboard without publishing a new version',update?.args?.p_soundboard_config?.[0]?.label==='Updated First Down',update?.args?.p_soundboard_config?.[0]?.label||'');
ok('Update keeps same current version target',window.__gamedayCurrentVersionAdminV1.state().version===7,JSON.stringify(window.__gamedayCurrentVersionAdminV1.state()));
ok('Update does not call new-version RPC',rpcCalls.filter(x=>x.name==='publish_game_version_v3').length===0,JSON.stringify(rpcCalls.map(x=>x.name)));
$('publishGame').click();await wait(120);
ok('Publish New Version remains a separate action',rpcCalls.filter(x=>x.name==='publish_game_version_v3').length===1,JSON.stringify(rpcCalls.map(x=>x.name)));
ok('new publish becomes the editable current version',window.__gamedayCurrentVersionAdminV1.state().version===8,JSON.stringify(window.__gamedayCurrentVersionAdminV1.state()));
ok('no page errors',__errors.length===0,JSON.stringify(__errors));
document.body.dataset.uat=results.every(x=>x.pass)?'PASS':'FAIL';$('out').textContent=JSON.stringify(results,null,2);})();
</script></body></html>

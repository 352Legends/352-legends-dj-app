name: GameDay UAT
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static runtime checks
        shell: bash
        run: |
          node --check core-v3.js
          node --check spotify-playback-v4.js
          node --check spotify-browser-player-v6.js
          node --check gameday-mixer-v1.js
          node --check ios-volume-output-v1.js
          node --check music-stop-fade-v1.js
          node --check app-part3.js
          node --check app-part4.js
          node --check bootstrap.js
          ! grep -R "open.spotify.com/embed\|iframe-api/v1" core-v3.js spotify-playback-v4.js spotify-browser-player-v6.js gameday-mixer-v1.js ios-volume-output-v1.js music-stop-fade-v1.js index.html bootstrap.js
          ! grep -E "sprint[0-9]|core-v2" bootstrap.js
          ! grep -q "installAppleSdkBlocker" bootstrap.js
          grep -q "gameday-mixer-v1.js" bootstrap.js
          grep -q "ios-volume-output-v1.js" bootstrap.js
          grep -q "music-stop-fade-v1.js" bootstrap.js
          grep -q "supports_volume" ios-volume-output-v1.js
          grep -q "USE .*VOLUME-CAPABLE DEVICE\|volume-controllable Spotify Connect output" ios-volume-output-v1.js
          grep -q "FADE_MS = 2000" music-stop-fade-v1.js
          grep -q "streaming user-read-playback-state" core-v3.js
          grep -q "loadPublishedGame('')" bootstrap.js
          grep -q "spotify-auth" bootstrap.js
          grep -q "spotify-browser-player-v6.js" bootstrap.js
          grep -q "__gamedayIOSWebPlaybackMode" bootstrap.js
          grep -q "handleServerSpotifyCallback" bootstrap.js
          grep -q "startServerSpotifyAuth" bootstrap.js
          grep -q "SPOTIFY_ACCOUNT_NOT_ALLOWED" bootstrap.js
          grep -q "device_ids: \[deviceId\]" spotify-browser-player-v6.js
          grep -q "me/player/play?device_id=" spotify-browser-player-v6.js
          grep -q "activateElement" spotify-browser-player-v6.js
          grep -q "togglePlay" spotify-browser-player-v6.js
          grep -q "IOS_MAX_VOICE_BOOST" gameday-mixer-v1.js
          grep -q "createDynamicsCompressor" gameday-mixer-v1.js
          grep -q "spotifyPlayer.setVolume" gameday-mixer-v1.js
          grep -q "assetReferenceCount" app-part3.js
          grep -q "25\*1024\*1024" app-part3.js
      - name: Start local static site
        run: |
          python3 -m http.server 8080 >/tmp/gameday-http.log 2>&1 &
          echo $! >/tmp/gameday-http.pid
          sleep 1
      - name: Browser operator UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "http://127.0.0.1:8080/tests/operator-uat.html?game=uat" >/tmp/uat-dom.html
          cat /tmp/uat-dom.html
          grep -q 'data-uat="PASS"' /tmp/uat-dom.html
          grep -q 'Start Playback targets exact browser SDK device' /tmp/uat-dom.html
          grep -q 'active phone is overridden by GameDay Browser Player' /tmp/uat-dom.html
      - name: Desktop Spotify mixer UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8080/tests/mixer-uat.html" >/tmp/mixer-uat.html
          cat /tmp/mixer-uat.html
          grep -q 'data-uat="PASS"' /tmp/mixer-uat.html
          grep -q 'Spotify fader sets browser-player volume' /tmp/mixer-uat.html
          grep -q 'announcement ducks Spotify by 3 dB' /tmp/mixer-uat.html
          grep -q 'Spotify volume restores to user mix' /tmp/mixer-uat.html
      - name: Master Stop Music fade UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "http://127.0.0.1:8080/tests/music-stop-fade-uat.html" >/tmp/music-fade-uat.html
          cat /tmp/music-fade-uat.html
          grep -q 'data-uat="PASS"' /tmp/music-fade-uat.html
          grep -q 'Spotify Stop Music fades for about 2 seconds' /tmp/music-fade-uat.html
          grep -q 'Spotify fade reaches zero before pause' /tmp/music-fade-uat.html
          grep -q 'Uploaded music Stop Music also fades for about 2 seconds' /tmp/music-fade-uat.html
          grep -q 'LIVE/STOP ALL immediate stop function remains unmodified' /tmp/music-fade-uat.html
      - name: iOS browser audio UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "http://127.0.0.1:8080/tests/ios-browser-audio-uat.html" >/tmp/ios-uat-dom.html
          cat /tmp/ios-uat-dom.html
          grep -q 'data-uat="PASS"' /tmp/ios-uat-dom.html
          grep -q 'iOS activateElement runs before network requests' /tmp/ios-uat-dom.html
          grep -q 'iOS silent-playing recovery calls local togglePlay' /tmp/ios-uat-dom.html
          grep -q 'iOS local SDK ends unpaused' /tmp/ios-uat-dom.html
      - name: iOS backing mixer UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8080/tests/ios-mixer-uat.html" >/tmp/ios-mixer-uat.html
          cat /tmp/ios-mixer-uat.html
          grep -q 'data-uat="PASS"' /tmp/ios-mixer-uat.html
          grep -q 'iOS detects locked Spotify browser volume' /tmp/ios-mixer-uat.html
          grep -q 'iOS backing mix lifts announcer channel' /tmp/ios-mixer-uat.html
          grep -q 'iOS announcement limiter is installed' /tmp/ios-mixer-uat.html
      - name: iOS Spotify volume output UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "http://127.0.0.1:8080/tests/ios-volume-output-uat.html" >/tmp/ios-volume-output-uat.html
          cat /tmp/ios-volume-output-uat.html
          grep -q 'data-uat="PASS"' /tmp/ios-volume-output-uat.html
          grep -q 'iOS browser Spotify fader disables when volume is hardware-locked' /tmp/ios-volume-output-uat.html
          grep -q 'iOS offers a volume-capable Spotify Connect output' /tmp/ios-volume-output-uat.html
          grep -q 'Spotify fader re-enables on controllable output' /tmp/ios-volume-output-uat.html
      - name: Root Home published-game regression
        shell: bash
        run: |
          curl -fsS "https://voynfqugirhtvmmmtpav.supabase.co/functions/v1/published-game" >/tmp/game.json
          python3 - <<'PY'
          import json
          g=json.load(open('/tmp/game.json'))
          assert g.get('slug')
          assert g.get('spotifyUrl','').startswith('https://open.spotify.com/playlist/')
          assert g.get('spotifyClientId')
          assert isinstance(g.get('soundboardConfig'), list)
          print('root Home resolves published Spotify config for', g['slug'])
          PY
      - name: Spotify auth bridge start regression
        shell: bash
        run: |
          curl -fsS -X POST "https://voynfqugirhtvmmmtpav.supabase.co/functions/v1/spotify-auth" \
            -H 'Content-Type: application/json' \
            --data '{"action":"start","slug":"352-vs-legends","return_url":"https://352legends.github.io/352-legends-dj-app/?game=352-vs-legends"}' >/tmp/spotify-auth.json
          python3 - <<'PY'
          import json, urllib.parse
          x=json.load(open('/tmp/spotify-auth.json'))
          assert x.get('auth_url','').startswith('https://accounts.spotify.com/authorize?')
          q=urllib.parse.parse_qs(urllib.parse.urlparse(x['auth_url']).query)
          assert q['client_id'][0]=='15a6851c05f84d058d2ca265381ab17c'
          assert q['redirect_uri'][0]=='https://352legends.github.io/352-legends-dj-app/'
          assert 'streaming' in q['scope'][0].split()
          assert q['show_dialog'][0]=='true'
          print('Spotify server PKCE bridge start passed')
          PY

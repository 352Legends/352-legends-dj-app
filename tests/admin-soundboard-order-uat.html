{id:'pre1',label:'Welcome',eyebrow:'PRE',group:'Pre-Game',kind:'announcement',icon:'',color:'orange',assetId:'',speechText:'Welcome'},

<script src="../admin-soundboard-order-v1.js"></script>
<script>
const results=[];const ok=(name,cond,detail='')=>results.push({name,pass:!!cond,detail});
const ids=()=>soundboardDraft.map(x=>x.id).join('|');
const groups=()=>window.__gamedayAdminSoundboardOrderV1.state().groups.join('|');
setTimeout(()=>{
  ok('admin editor renders soundboard as groups',document.querySelectorAll('[data-admin-group]').length===3,String(document.querySelectorAll('[data-admin-group]').length));
  ok('admin can reorder whole soundboard groups',!!document.querySelector('[data-admin-group="Downs"] [data-group-move="up"]'));
  document.querySelector('[data-admin-group="Downs"] [data-group-move="up"]')?.click();
  ok('moving a group moves all of its announcements together',groups()==='Downs|Pre-Game|Sponsors'&&ids()==='down1|down2|pre1|sponsor1',groups()+' / '+ids());
  document.querySelector('[data-item="down2"] [data-item-move="up"]')?.click();
  ok('admin can reorder announcements within a group',ids()==='down2|down1|pre1|sponsor1',ids());
  ok('announcement move does not cross into another group',soundboardDraft.slice(0,2).every(x=>x.group==='Downs')&&soundboardDraft[2].group==='Pre-Game',ids());
  const first=document.querySelector('[data-admin-group="Downs"] [data-item]');
  ok('editor visibly reflects announcement order',first?.dataset.item==='down2',first?.dataset.item||'');
  collectSoundEditor();
  ok('collect preserves hierarchical draft order for publishing',ids()==='down2|down1|pre1|sponsor1',ids());
  ok('no page errors',__errors.length===0,JSON.stringify(__errors));
  document.getElementById('out').textContent=JSON.stringify(results,null,2);document.body.dataset.uat=results.every(x=>x.pass)?'PASS':'FAIL';
},120);
</script></body></html>

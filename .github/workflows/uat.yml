name: GameDay UAT
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Static runtime checks
        shell: bash
        run: |
          node --check core-v3.js
          node --check local-only-v1.js
          node --check local-mixer-v1.js
          node --check local-stop-fade-v1.js
          node --check uploaded-music-v1.js
          node --check soundboard-groups-v1.js
          node --check soundboard-group-order-v1.js
          node --check app-part3.js
          node --check app-part4.js
          node --check bootstrap.js
          ! grep -qi "spotify" index.html
          ! grep -Eq "spotify-playback-v4.js|spotify-browser-player-v6.js|gameday-mixer-v1.js|ios-volume-output-v1.js|music-stop-fade-v1.js" bootstrap.js
          ! grep -Eq "spotify-auth|sdk.scdn.co|api.spotify.com|accounts.spotify.com" bootstrap.js
          grep -q "local-only-v1.js" bootstrap.js
          grep -q "local-mixer-v1.js" bootstrap.js
          grep -q "local-stop-fade-v1.js" bootstrap.js
          grep -q "uploaded-music-v1.js" bootstrap.js
          grep -q "soundboard-groups-v1.js" bootstrap.js
          grep -q "soundboard-group-order-v1.js" bootstrap.js
          grep -q "group-order-v20" bootstrap.js
          grep -q "input.multiple = true" uploaded-music-v1.js
          grep -q "bulkUploadFiles" uploaded-music-v1.js
          grep -q "data-local-seek" uploaded-music-v1.js
          grep -q "data-local-shuffle" uploaded-music-v1.js
          grep -q "data-local-repeat" uploaded-music-v1.js
          grep -q "data-music-up" uploaded-music-v1.js
          grep -q "data-group-filter" soundboard-groups-v1.js
          grep -q "soundboardUploadedMusic" soundboard-groups-v1.js
          grep -q "gameday.soundboard.groupOrder.v1" soundboard-group-order-v1.js
          grep -q "REORDER GROUPS" soundboard-group-order-v1.js
          grep -q "data-order-up" soundboard-group-order-v1.js
          grep -q "data-order-reset" soundboard-group-order-v1.js
          grep -q "data-f=\\\"group\\\"" app-part4.js
          grep -q "group,kind,icon,color,speechText" app-part4.js
          grep -q "p_spotify_url:null" app-part4.js
          grep -q "p_spotify_client_id:null" app-part4.js
          grep -q "p_default_music_source:'LOCAL'" app-part4.js
          grep -q "default_spotify_url:null" app-part4.js
          grep -q "default_music_source:'LOCAL'" app-part4.js
          grep -q "chooseFreshRandomIndex" local-only-v1.js
          grep -q "lastMasterRandomIndex" local-only-v1.js
          grep -q "musicAudio.currentTime = 0" local-only-v1.js
          grep -q "gd-random-master" local-only-v1.js
          grep -q "FADE_MS = 3000" local-stop-fade-v1.js
          grep -q "Music fading out • 3 sec" local-stop-fade-v1.js
          grep -q "Uploaded music gain" local-mixer-v1.js
          grep -q "assetReferenceCount" app-part3.js
          grep -q "25\*1024\*1024" app-part3.js
          grep -q "loadPublishedGame('')" bootstrap.js
      - name: Start local static site
        run: |
          python3 -m http.server 8080 >/tmp/gameday-http.log 2>&1 &
          echo $! >/tmp/gameday-http.pid
          sleep 1
      - name: Uploaded-music-only random master UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "http://127.0.0.1:8080/tests/local-only-uat.html" >/tmp/local-only-uat.html
          cat /tmp/local-only-uat.html
          grep -q 'data-uat="PASS"' /tmp/local-only-uat.html
          grep -q 'legacy Spotify surfaces are removed' /tmp/local-only-uat.html
          grep -q 'source switch cannot reactivate Spotify' /tmp/local-only-uat.html
          grep -q 'master control is large and touch-friendly' /tmp/local-only-uat.html
          grep -q 'master start uses uploaded music' /tmp/local-only-uat.html
          grep -q 'random master start begins track at zero' /tmp/local-only-uat.html
          grep -q 'consecutive master starts choose a fresh random track' /tmp/local-only-uat.html
          grep -q 'second random track also starts at zero' /tmp/local-only-uat.html
          grep -q 'old published Spotify default is converted to LOCAL' /tmp/local-only-uat.html
      - name: Uploaded music library UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/tests/uploaded-music-uat.html" >/tmp/uploaded-music-uat.html
          cat /tmp/uploaded-music-uat.html
          grep -q 'data-uat="PASS"' /tmp/uploaded-music-uat.html
          grep -q 'bulk music input accepts multiple files' /tmp/uploaded-music-uat.html
          grep -q 'operator can select an exact uploaded track' /tmp/uploaded-music-uat.html
          grep -q 'operator can seek within uploaded track' /tmp/uploaded-music-uat.html
          grep -q 'LIVE PLAY blocks uploaded music start' /tmp/uploaded-music-uat.html
          grep -q 'bulk upload accepts multiple audio tracks in one action' /tmp/uploaded-music-uat.html
          grep -q 'admin can reorder published uploaded tracks' /tmp/uploaded-music-uat.html
      - name: Grouped soundboard UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "http://127.0.0.1:8080/tests/soundboard-groups-uat.html" >/tmp/soundboard-groups-uat.html
          cat /tmp/soundboard-groups-uat.html
          grep -q 'data-uat="PASS"' /tmp/soundboard-groups-uat.html
          grep -q 'Uploaded music player is beside soundboard' /tmp/soundboard-groups-uat.html
          grep -q 'Announcement groups include fast categories' /tmp/soundboard-groups-uat.html
          grep -q 'Group filter isolates selected announcement type' /tmp/soundboard-groups-uat.html
          grep -q 'Soundboard library directly selects a track' /tmp/soundboard-groups-uat.html
      - name: Soundboard group ordering UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "http://127.0.0.1:8080/tests/soundboard-group-order-uat.html" >/tmp/soundboard-group-order-uat.html
          cat /tmp/soundboard-group-order-uat.html
          grep -q 'data-uat="PASS"' /tmp/soundboard-group-order-uat.html
          grep -q 'reorder groups control is available' /tmp/soundboard-group-order-uat.html
          grep -q 'user can move a group down' /tmp/soundboard-group-order-uat.html
          grep -q 'group order persists on this device' /tmp/soundboard-group-order-uat.html
          grep -q 'saved order restores after soundboard rerender' /tmp/soundboard-group-order-uat.html
          grep -q 'reset returns published default group order' /tmp/soundboard-group-order-uat.html
          grep -q 'ALL stays pinned first' /tmp/soundboard-group-order-uat.html
      - name: Uploaded music mixer UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "http://127.0.0.1:8080/tests/local-mixer-uat.html" >/tmp/local-mixer-uat.html
          cat /tmp/local-mixer-uat.html
          grep -q 'data-uat="PASS"' /tmp/local-mixer-uat.html
          grep -q 'music slider saves uploaded music gain' /tmp/local-mixer-uat.html
          grep -q 'announcement slider remains independent' /tmp/local-mixer-uat.html
      - name: Uploaded music three-second fade UAT
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom "http://127.0.0.1:8080/tests/local-stop-fade-uat.html" >/tmp/local-fade-uat.html
          cat /tmp/local-fade-uat.html
          grep -q 'data-uat="PASS"' /tmp/local-fade-uat.html
          grep -q 'Uploaded music Stop Music fades for about 3 seconds' /tmp/local-fade-uat.html
          grep -q 'Uploaded music fade reaches zero before pause' /tmp/local-fade-uat.html
          grep -q 'LIVE STOP ALL remains immediate' /tmp/local-fade-uat.html
      - name: Root Home published-game regression
        shell: bash
        run: |
          curl -fsS "https://voynfqugirhtvmmmtpav.supabase.co/functions/v1/published-game" >/tmp/game.json
          python3 - <<'PY'
          import json
          g=json.load(open('/tmp/game.json'))
          assert g.get('slug')
          assert isinstance(g.get('soundboardConfig'), list)
          assert isinstance(g.get('musicTracks'), list)
          print('root Home resolves published game data for', g['slug'], 'with', len(g['musicTracks']), 'uploaded music tracks')
          PY
